services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docmind_db
    environment:
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: docmind_password
      POSTGRES_DB: docmind
    ports:
      - '5432:5432'
    volumes:
      - docmind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docmind -d docmind']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - docmind_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: docmind_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - docmind_network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docmind_api
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://docmind:docmind_password@postgres:5432/docmind
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - API_KEY=${API_KEY}
      - CHAT_MODEL=${CHAT_MODEL:-gpt-4o-mini}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-1536}
      - CHUNK_SIZE_CHARS=${CHUNK_SIZE_CHARS:-1200}
      - CHUNK_OVERLAP_CHARS=${CHUNK_OVERLAP_CHARS:-200}
      - RATE_LIMIT_TTL=${RATE_LIMIT_TTL:-60000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - docmind_network
    restart: unless-stopped

volumes:
  docmind_pgdata:

networks:
  docmind_network:
    driver: bridge