version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docmind_db
    environment:
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: docmind_password
      POSTGRES_DB: docmind
    ports:
      - '5432:5432'
    volumes:
      - docmind_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: docmind_redis
    ports:
      - '6379:6379'
    restart: unless-stopped

volumes:
  docmind_pgdata: